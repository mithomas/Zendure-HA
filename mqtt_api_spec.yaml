components:
  schemas:
    AvailabilityOnline:
      type: string
      enum:
        - online
    BinaryOnOff:
      type: string
      enum:
        - ON
        - OFF
    AcMode:
      type: string
      oneOf:
        - const: Input mode
          description: device can load power from the grid
        - const: Output mode
          description: device can send power to the grid
    GridReverse:
      type: string
      oneOf:
        - const: Allow backflow
        - const: Disallow backflow
    GridOffMode:
      type: string
      oneOf:
        - const: Normal mode
          description: socket is active (inverter running)
        - const: Economic mode
          description: socket is active for ? minutes
        - const: OFF
          description: socket is off
